spring.application.name=${SPRING_APPLICATION_NAME:Grocery Household App}

app.environment=${APP_ENV:local}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grocerydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_32+_CHAR_SECRET_KEY!!!!!!!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:45}
password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:5173/reset-password}
password-reset.delivery-mode=${PASSWORD_RESET_DELIVERY_MODE:console}
